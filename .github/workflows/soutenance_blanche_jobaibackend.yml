name: Build and deploy Python app to Azure Web App - jobaibackend

on:
  push:
    branches:
      - soutenance_blanche
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies and zip backend
        working-directory: backend-cv
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          cd ..
          zip -r release.zip backend-cv/

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B538B6637B9F47EB997A915C07A39730 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4DD6638AE6E24FAF984EB36A98781397 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F11AFFC529C54D808939CAE58BA9DD07 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'jobaibackend'
          slot-name: 'Production'
          package: './backend-cv'
